<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Комодский варан — автосервис</title>
  <desc id="logo-desc">Геометрический знак: буква К, переплетённая с гаечным ключом, на тёмно-металлическом щите.</desc>
  <defs>
    <linearGradient id="kv-badge" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#2c313a"/>
      <stop offset="0.55" stop-color="#171a20"/>
      <stop offset="1" stop-color="#0d0f13"/>
    </linearGradient>
    <linearGradient id="kv-metal" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#f4f6f9"/>
      <stop offset="0.35" stop-color="#c8ced7"/>
      <stop offset="0.62" stop-color="#9ba3af"/>
      <stop offset="1" stop-color="#6d7683"/>
    </linearGradient>
    <linearGradient id="kv-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b45"/>
      <stop offset="1" stop-color="#c40817"/>
    </linearGradient>
    <mask id="kv-slot" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
      <rect width="120" height="120" fill="#fff"/>
      <g transform="rotate(-45 78 35)">
        <rect x="81" y="29.5" width="24" height="11" fill="#000"/>
        <circle cx="81" cy="35" r="5.5" fill="#000"/>
      </g>
    </mask>
  </defs>

  <!-- Щит -->
  <path d="M60 3 L109 31 V89 L60 117 L11 89 V31 Z" fill="url(#kv-badge)" stroke="#3d444f" stroke-width="1.6"/>
  <path d="M60 8 L104.5 34 V86 L60 112 L15.5 86 V34 Z" fill="none" stroke="#4a525e" stroke-width="0.8" opacity="0.7"/>

  <!-- Стойка буквы К -->
  <path d="M33 28 L36 25 L46 25 L46 90 L43 93 L33 93 Z" fill="url(#kv-metal)"/>
  <path d="M36 25 L46 25 L46 32 L36 32 Z" fill="#ffffff" opacity="0.35"/>

  <!-- Верхняя диагональ — гаечный ключ -->
  <g mask="url(#kv-slot)">
    <path d="M44.3 57.9 L74.3 30.9 L81.7 39.1 L51.7 66.1 Z" fill="url(#kv-metal)"/>
    <circle cx="78" cy="35" r="15.5" fill="url(#kv-metal)"/>
    <path d="M78 19.5 A15.5 15.5 0 0 0 63 32 L70 32 A9 9 0 0 1 78 24 Z" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- Нижняя диагональ -->
  <path d="M43.7 66.8 L83.3 99 L88.7 93 L52.3 57.2 Z" fill="url(#kv-metal)"/>

  <!-- Красная гайка в узле -->
  <path d="M54.9 58 L54.9 66 L48 70 L41.1 66 L41.1 58 L48 54 Z" fill="url(#kv-red)"/>
  <path d="M54.9 58 L54.9 66 L48 70 L48 62 Z" fill="#ffffff" opacity="0.12"/>
  <circle cx="48" cy="62" r="3.6" fill="#15181d"/>
</svg>
